apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: legal-ref
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.17-enterprise
          env:
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            - name: NEO4J_dbms_memory_heap_max__size
              value: "8G"
            - name: NEO4J_dbms_memory_pagecache_size
              value: "4G"
          ports:
            - containerPort: 7687
            - containerPort: 7474
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 500Gi
