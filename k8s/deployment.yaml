apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-ref-api
  namespace: legal-ref
  labels:
    app: legal-ref-api
    version: "1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: legal-ref-api
  template:
    metadata:
      labels:
        app: legal-ref-api
    spec:
      containers:
        - name: api
          image: ghcr.io/stevenkaranja/legal-ref-api:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: legal-ref-secrets
                  key: neo4j-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: legal-ref-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
